<!DOCTYPE html>
<html>
<head>
  <title>Zepto Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .nav { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .nav a { padding: 10px 16px; background: #6c2bd9; color: white; text-decoration: none; border-radius: 20px; }
    .nav .cart { margin-left: auto; position: relative; }
    .badge { position: absolute; top: -6px; right: -6px; background: #e5484d; color: white; font-size: 12px; min-width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 50%; }
    .call-options { display: flex; gap: 10px; flex-wrap: wrap; }
    .call-btn { padding: 12px 18px; background: #16a34a; color: white; text-decoration: none; border-radius: 10px; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .product { border: 1px solid #ddd; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
    .cart-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid #eee; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #6c2bd9; background: white; color: #6c2bd9; cursor: pointer; }
    .qty button:disabled { opacity: 0.4; cursor: not-allowed; }
    .place-btn { margin-top: 16px; padding: 12px 24px; background: #16a34a; color: white; border: 0; border-radius: 10px; font-size: 16px; cursor: pointer; }
    .place-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    dialog { border: 0; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    dialog::backdrop { background: rgba(0,0,0,0.4); }
    dialog input { display: block; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin: 8px 0 12px; }
    .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #16a34a; color: white; padding: 14px 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 1000; font-size: 18px; }
    .order-card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin-bottom: 12px; line-height: 1.8; }
   </style>
</head>
<body>
     {% block nav %}
  <div class="nav">
    <a href="/">Home</a>
    <a href="/cart" class="cart">🛒{% if cart_count %}<span class="badge">{{ cart_count }}</span>{% endif %}</a>
  </div>
  {% endblock %}
    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="toast" id="toast">{{ messages[0] }}</div>
      <script>setTimeout(() => document.getElementById("toast").remove(), 3000);</script>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
