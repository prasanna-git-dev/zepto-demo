{% extends "base.html" %}

{% block content %}
  <h1>Hi {{ customer.name }}!</h1>
  <p>Your order #{{ order.id }}: {{ order.item }}</p>
  <p>Status: {{ order.status }}</p>

  <button id="alertBtn" type="button" style="background:#6c2bd9; color:white; border:0; padding:10px 16px; border-radius:8px; cursor:pointer;">🔔 Enable call alerts</button>
  <p id="alertMsg"></p>

  <h3>Calls from your delivery partner</h3>
  <iframe src="{{ room_url }}" allow="microphone" width="100%" height="320" style="border:0;"></iframe>

  <script>
    const VAPID_KEY = "{{ vapid_key }}";
    const ORDER_ID = {{ order.id }};

    function keyToBytes(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    document.getElementById("alertBtn").addEventListener("click", async () => {
      const msg = document.getElementById("alertMsg");

      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        msg.textContent = "This browser can't receive call alerts.";
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        msg.textContent = "Alerts are blocked. Allow notifications for this site and try again.";
        return;
      }

      const registration = await navigator.serviceWorker.register("/sw.js");
      await navigator.serviceWorker.ready;

      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: keyToBytes(VAPID_KEY)
      });

      await fetch("/subscribe/" + ORDER_ID, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(subscription)
      });

      msg.textContent = "✅ Call alerts are on for this device.";
    });
  </script>
{% endblock %}
