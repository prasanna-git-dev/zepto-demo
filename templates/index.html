{% extends "base.html" %}

{% block content %}
  <h1>Zepto Demo</h1>
  <p>Groceries in 10 minutes (practice app)</p>

  <div class="products">
    {% for p in products %}
      <div class="product">
        <strong>{{ p.name }}</strong>
        <span>₹{{ p.price }}</span>
        <form method="POST" action="/add-to-cart/{{ p.id }}">
          <button type="submit" style="background:#6c2bd9; color:white; border:0; padding:10px; border-radius:8px; cursor:pointer;">Add to cart</button>
        </form>
      </div>
    {% endfor %}
  </div>
{% endblock %}
